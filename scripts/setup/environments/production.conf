# Production constants for ./run setup production. No secrets belong here.
SETUP_ENV=production
GCP_PROJECT_ID=logdate
FIREBASE_PROJECT_ID=logdate
ANDROID_PACKAGE=studio.hypertext.logdate
FIREBASE_ANDROID_APP_ID=1:216887423795:android:1d5cb98b3aaefc568ec446
BACKEND_URL=https://cloud.logdate.app
# Release builds read this project's config whatever backend they target, so
# it carries the staging signer too.
FIREBASE_SIGNERS="production staging"
GITHUB_ENVIRONMENT=production
# main: Play internal; android-v*: Play promotion; server-v*: server releases.
DEPLOY_BRANCHES="main"
DEPLOY_TAGS="android-v* server-v*"
PLAY_PUBLISHING=true
PLAY_SERVICE_ACCOUNT_NAME=play-publisher
# Workload Identity pool that GitHub Actions authenticates through (no keys).
GITHUB_WIF_POOL=logdate-github-pool
