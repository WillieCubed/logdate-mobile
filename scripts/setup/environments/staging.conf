# Staging constants for ./run setup staging. No secrets belong here.
SETUP_ENV=staging
GCP_PROJECT_ID=logdate-dev
FIREBASE_PROJECT_ID=logdate-dev
ANDROID_PACKAGE=studio.hypertext.logdate
FIREBASE_ANDROID_APP_ID=1:786734185325:android:d1d954e3ec8b414b23f864
# Debug builds use their own applicationId, so they need their own Firebase app.
ANDROID_DEBUG_PACKAGE=studio.hypertext.logdate.debug
BACKEND_URL=https://cloud-staging.logdate.app
# Debug builds are signed with per-machine keys; staging-signed release builds
# use the production Firebase project, which registers their signer.
FIREBASE_SIGNERS=""
GITHUB_ENVIRONMENT=staging
DEPLOY_BRANCHES="main"
DEPLOY_TAGS=""
PLAY_PUBLISHING=false
