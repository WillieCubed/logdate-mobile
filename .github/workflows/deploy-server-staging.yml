name: Deploy Server Staging
run-name: Deploy staging server from ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy staging revision
    # The workflow_run trigger above could never satisfy a workflow_dispatch-only guard, so
    # staging only ever deployed by hand - and production, which requires a successful staging
    # deploy for the same SHA, could not be released without someone remembering to dispatch it.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      }}
    uses: ./.github/workflows/deploy-server-cloud-run.yml
    with:
      environment: staging
      deploy-sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
