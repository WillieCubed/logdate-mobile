name: CI
run-name: CI for ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: read

# A newer push to the same pull request makes the older run moot. Runs on
# main are never cancelled, because staging deploys each successful one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start test services with registry failover
        run: python3 scripts/ci/start-test-services.py start unit

      - name: Materialize Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The repository engine's JVM tests verify exported repositories with the AT Protocol
      # reference implementation, which runs on Node.js (tools/atproto-repo-verify).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Run tests
        # JVM/Android and multiplatform modules need both aggregates. Server/client e2e
        # tests belong to their dedicated job rather than running twice. The iOS and
        # Wasm test targets run in the multiplatform job. Compiling them here grew the
        # Gradle daemon from 5 to 9 GB and left under 1 GB of the runner's 16 GB free;
        # a runner that runs out of memory is shut down with no error from Gradle.
        run: |
          ./gradlew test allTests --continue \
            -x :integration:server-client-e2e:test \
            -x iosSimulatorArm64Test -x wasmJsTest -x wasmJsBrowserTest
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/logdate_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          REDIS_URL: redis://localhost:6379

      - name: Upload unit-test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-reports
          if-no-files-found: warn
          path: |
            **/build/test-results/**
            **/build/reports/tests

      - name: Generate coverage report
        run: ./gradlew koverXmlReport
        continue-on-error: true

      - name: Prepare Codecov upload
        id: coverage
        # Each module with the Kover plugin writes build/reports/kover/report.xml. The root
        # report (build/reports/kover/coverage.xml) merges no modules, so it has no classes.
        # Codecov accepts uploads without a token only from forks' pull requests.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          FORK_PULL_REQUEST: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          files="$(find . -path '*/build/reports/kover/report.xml' | sort | paste -sd, -)"
          if [[ -z "$files" ]]; then
            echo "::warning title=No coverage uploaded::koverXmlReport wrote no module reports, so there is nothing to upload."
          else
            echo "Coverage reports: $files"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [[ -z "$CODECOV_TOKEN" && "$FORK_PULL_REQUEST" != "true" ]]; then
            echo "::warning title=Codecov token missing::The CODECOV_TOKEN repository secret is not set. Codecov rejects this upload without it; add the repository's upload token from codecov.io as CODECOV_TOKEN."
          fi

      - name: Upload coverage to Codecov
        if: ${{ steps.coverage.outputs.files != '' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ${{ steps.coverage.outputs.files }}
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Stop test services
        if: always()
        run: python3 scripts/ci/start-test-services.py stop unit

  multiplatform-tests:
    name: iOS compile and Wasm tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Materialize Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run iOS and Wasm tests
        # The test targets the unit-test job leaves out. Linux compiles every iOS main and
        # test source set but cannot link or run iOS binaries, so the iOS test tasks skip
        # after compiling, as they did in the unit-test job. Wasm tests run in a browser.
        run: ./gradlew iosSimulatorArm64Test wasmJsTest --continue

      - name: Upload multiplatform test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiplatform-test-reports
          if-no-files-found: warn
          path: |
            **/build/test-results/**
            **/build/reports/tests

  e2e-tests:
    name: Server / client e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start test services with registry failover
        run: python3 scripts/ci/start-test-services.py start e2e
      - name: Check database function privileges
        timeout-minutes: 2
        run: |
          LOGDATE_TEST_POSTGRES_IMAGE="$(docker inspect --format '{{.Image}}' "logdate-ci-postgres-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}")" \
            python3 scripts/tests/database/test-function-privileges.py
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Run e2e tests
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/logdate
          DATABASE_USER: logdate
          DATABASE_PASSWORD: logdate
        run: ./gradlew :integration:server-client-e2e:test --no-daemon --continue
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-test-reports
          path: integration/server-client-e2e/build/reports/tests

      - name: Stop test services
        if: always()
        run: python3 scripts/ci/start-test-services.py stop e2e

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Materialize Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Check Home workspace ownership
        run: ./gradlew checkHomeWorkspaceContract

      - name: Check hardcoded Compose literals
        run: ./scripts/check_hardcoded_compose_literals.sh

      - name: Run lint
        run: ./gradlew lint detekt

  scripts:
    name: Script tests
    permissions:
      contents: read
      packages: read
    # The scripts target developer Macs and use macOS tools (plutil, BSD stat). The
    # pinned commit formatters the hook tests prepare ship only Apple Silicon builds
    # for macOS, so this runs on the Apple Silicon image.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1

      - name: Install script test dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: ./run setup --only test-deps --non-interactive

      - name: Lint setup scripts
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck -x -e SC1091 run scripts/lib/*.sh scripts/setup/*.sh scripts/setup/steps/*.sh

      - name: Run script tests
        run: ./scripts/tests/run-all.sh

  android-release:
    name: Android release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Materialize Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The shipped artifact is the shrunk one. Building it here is what catches R8
      # configuration regressions - stripped serializers, renamed JNI classes - which no
      # debug build or unit test can surface. Debug signing keeps this non-publishable.
      - name: Build shrunk release artifact
        run: |
          ./gradlew :app:android-main:assembleRelease \
            -Plogdate.allowDebugReleaseSigning=true

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-release-mapping
          path: app/android-main/build/outputs/mapping/release/mapping.txt
          retention-days: 7

  build:
    name: Server artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build server
        run: ./gradlew :server:build -x test -x jacocoTestCoverageVerification

      - name: Upload server artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-jar
          path: server/build/libs/logdate-server.jar
          retention-days: 7
