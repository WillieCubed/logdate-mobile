name: Deploy Server Cloud Run
run-name: Deploy ${{ inputs.environment }} server from ${{ inputs.deploy-sha }}

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment configured in GitHub Environments and Terraform tfvars.
        required: true
        type: string
      deploy-sha:
        description: Commit SHA to deploy.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      DEPLOY_SHA: ${{ inputs.deploy-sha }}
      ENVIRONMENT: ${{ inputs.environment }}
      # Fail provider registry calls promptly so a transient Terraform registry
      # outage produces actionable logs instead of consuming the whole deploy window.
      TF_REGISTRY_CLIENT_TIMEOUT: 60
      REPO_PROJECT_ID: ${{ vars.LOGDATE_PROJECT_ID }}
      REPO_REGION: ${{ vars.LOGDATE_REGION }}
      REPO_SERVICE_NAME: ${{ vars.LOGDATE_SERVICE_NAME }}
      REPO_DOMAIN: ${{ vars.LOGDATE_DOMAIN }}
      REPO_ARTIFACT_REGISTRY_REPO: ${{ vars.LOGDATE_ARTIFACT_REGISTRY_REPO }}
      REPO_RUNTIME_SERVICE_ACCOUNT: ${{ vars.LOGDATE_RUNTIME_SERVICE_ACCOUNT }}
      REPO_DEPLOY_SOURCE: ${{ vars.LOGDATE_DEPLOY_SOURCE }}

    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Load deployment configuration
        run: |
          TF_DIR="infra/terraform"
          TFVARS_FILE="${TF_DIR}/${ENVIRONMENT}.tfvars"
          if [[ "${REPO_DEPLOY_SOURCE}" == "repo_vars" ]]; then
            PROJECT_ID="${REPO_PROJECT_ID}"
            REGION="${REPO_REGION}"
            SERVICE_NAME="${REPO_SERVICE_NAME}"
            DOMAIN="${REPO_DOMAIN}"
            ARTIFACT_REGISTRY_REPO="${REPO_ARTIFACT_REGISTRY_REPO}"
            RUNTIME_SERVICE_ACCOUNT_EMAIL="${REPO_RUNTIME_SERVICE_ACCOUNT}"

            echo "Using repository deployment variables because LOGDATE_DEPLOY_SOURCE=repo_vars."
          elif [[ -f "$TFVARS_FILE" ]]; then
            terraform -chdir="$TF_DIR" init -backend=false -input=false
            TFVARS_BASENAME="$(basename "$TFVARS_FILE")"

            tf_value() {
              local value
              value=$(printf 'var.%s\n' "$1" | terraform -chdir="$TF_DIR" console -var-file="$TFVARS_BASENAME" 2>/dev/null | sed -e 's/^> //' | sed '/^$/d' | tail -n 1)
              value="${value%\"}"
              value="${value#\"}"
              if [[ "$value" == "null" ]]; then
                value=""
              fi
              echo "$value"
            }

            PROJECT_ID=$(tf_value project_id)
            REGION=$(tf_value region)
            SERVICE_NAME=$(tf_value service_name)
            DOMAIN=$(tf_value domain)
            ARTIFACT_REGISTRY_REPO=$(tf_value artifact_registry_repo)
            RUNTIME_SERVICE_ACCOUNT_NAME=$(tf_value runtime_service_account_name)

            if [[ -n "$RUNTIME_SERVICE_ACCOUNT_NAME" && -n "$PROJECT_ID" ]]; then
              RUNTIME_SERVICE_ACCOUNT_EMAIL="${RUNTIME_SERVICE_ACCOUNT_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"
            else
              RUNTIME_SERVICE_ACCOUNT_EMAIL=""
            fi

            echo "Using tfvars configuration from $TFVARS_FILE"
          else
            PROJECT_ID="${REPO_PROJECT_ID}"
            REGION="${REPO_REGION}"
            SERVICE_NAME="${REPO_SERVICE_NAME}"
            DOMAIN="${REPO_DOMAIN}"
            ARTIFACT_REGISTRY_REPO="${REPO_ARTIFACT_REGISTRY_REPO}"
            RUNTIME_SERVICE_ACCOUNT_EMAIL="${REPO_RUNTIME_SERVICE_ACCOUNT}"

            echo "Using repository deployment variables because $TFVARS_FILE is not present."
          fi

          {
            echo "TFVARS_FILE=$TFVARS_FILE"
            echo "PROJECT_ID=$PROJECT_ID"
            echo "REGION=$REGION"
            echo "SERVICE_NAME=$SERVICE_NAME"
            echo "DOMAIN=$DOMAIN"
            echo "ARTIFACT_REGISTRY_REPO=$ARTIFACT_REGISTRY_REPO"
            echo "RUNTIME_SERVICE_ACCOUNT=$RUNTIME_SERVICE_ACCOUNT_EMAIL"
          } >> "$GITHUB_ENV"

      - name: Validate deployment configuration
        run: |
          if [[ -z "${SERVICE_NAME}" || -z "${PROJECT_ID}" || -z "${REGION}" ]]; then
            echo "SERVICE_NAME, PROJECT_ID, and REGION must be set in infra/terraform/${ENVIRONMENT}.tfvars or repository variables."
            exit 1
          fi

      - name: Render immutable deployment contract
        run: |
          CONTRACT_FILE="$(mktemp "${RUNNER_TEMP}/logdate-cloud-run-contract.XXXXXX.json")"
          chmod 600 "$CONTRACT_FILE"
          ./scripts/render-cloud-run-contract.sh \
            --environment "$ENVIRONMENT" \
            --release-sha "$DEPLOY_SHA" >"$CONTRACT_FILE"

          if [[ "$(jq -r '.project_id' "$CONTRACT_FILE")" != "$PROJECT_ID" ||
                "$(jq -r '.region' "$CONTRACT_FILE")" != "$REGION" ||
                "$(jq -r '.service_name' "$CONTRACT_FILE")" != "$SERVICE_NAME" ]]; then
            echo "Rendered deployment contract does not match the selected project, region, and service."
            exit 1
          fi

          echo "CONTRACT_FILE=$CONTRACT_FILE" >> "$GITHUB_ENV"
          if [[ "${PROJECT_ID}" == *"Terraform exited with code"* || "${REGION}" == *"Terraform exited with code"* ]]; then
            echo "SERVICE_NAME, PROJECT_ID, and REGION must be set in infra/terraform/${ENVIRONMENT}.tfvars or repository variables."
            exit 1
          fi
          if [[ -z "${DOMAIN}" ]]; then
            echo "DOMAIN is not set; custom domain verification will be skipped."
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          target: production
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/logdate-server:${{ env.DEPLOY_SHA }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/logdate-server:latest
          cache-from: |
            type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/logdate-server:buildcache
            type=gha,scope=${{ env.SERVICE_NAME }}-image
          cache-to: |
            type=registry,ref=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/logdate-server:buildcache,mode=max
            type=gha,mode=max,scope=${{ env.SERVICE_NAME }}-image

      - name: Run database migrations
        env:
          # Contract mode must source the project and database target only from
          # the immutable contract; do not leak the workflow's selector vars
          # in as independent overrides.
          PROJECT_ID: ""
          REGION: ""
        run: |
          ./scripts/run-migrations.sh \
            --contract-file "$CONTRACT_FILE" \
            --environment "$ENVIRONMENT" \
            --validate-passkey-fk

      - name: Configure candidate tag
        run: echo "CANDIDATE_TAG=c-${DEPLOY_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Set up Python with pip cache
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/passkey-verify/requirements.txt

      - name: Install passkey verifier dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r scripts/passkey-verify/requirements.txt

      - name: Deploy candidate revision without traffic
        run: |
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REGISTRY_REPO}/logdate-server:${DEPLOY_SHA}"
          CONTRACT_IMAGE="$(jq -r '.image' "$CONTRACT_FILE")"
          if [[ "$CONTRACT_IMAGE" != "$IMAGE_URI" ]]; then
            echo "Deployment contract image mismatch: expected $IMAGE_URI, got $CONTRACT_IMAGE"
            exit 1
          fi
          ENV_VARS_FILE="$(mktemp "${RUNNER_TEMP}/logdate-cloud-run-env.XXXXXX.yaml")"
          chmod 600 "$ENV_VARS_FILE"
          jq -c '.env_vars' "$CONTRACT_FILE" >"$ENV_VARS_FILE"
          SECRET_ENV_BINDINGS="$(jq -r '.secret_env | to_entries | map("\(.key)=\(.value.secret_id):\(.value.version)") | join(",")' "$CONTRACT_FILE")"

          service_account_args=()
          CONTRACT_RUNTIME_SERVICE_ACCOUNT="$(jq -r '.runtime_service_account' "$CONTRACT_FILE")"
          if [[ -n "$CONTRACT_RUNTIME_SERVICE_ACCOUNT" ]]; then
            service_account_args=(--service-account "$CONTRACT_RUNTIME_SERVICE_ACCOUNT")
          fi

          gcloud run deploy "$(jq -r '.service_name' "$CONTRACT_FILE")" \
            --image "$IMAGE_URI" \
            --platform managed \
            --region "$(jq -r '.region' "$CONTRACT_FILE")" \
            --project "$(jq -r '.project_id' "$CONTRACT_FILE")" \
            --no-traffic \
            --tag "$CANDIDATE_TAG" \
            --env-vars-file "$ENV_VARS_FILE" \
            --set-secrets "$SECRET_ENV_BINDINGS" \
            "${service_account_args[@]}"

          REVISION_URL=""
          for _ in $(seq 1 30); do
            REVISION_URL=$(
              gcloud run services describe "$(jq -r '.service_name' "$CONTRACT_FILE")" \
                --platform managed --region "$(jq -r '.region' "$CONTRACT_FILE")" --project "$(jq -r '.project_id' "$CONTRACT_FILE")" \
                --format=json |
                jq -r --arg tag "$CANDIDATE_TAG" '.status.traffic[]? | select(.tag == $tag) | .url // empty'
            )
            if [[ -n "$REVISION_URL" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$REVISION_URL" ]]; then
            echo "Timed out waiting for candidate revision URL for tag ${CANDIDATE_TAG}."
            gcloud run services describe "$(jq -r '.service_name' "$CONTRACT_FILE")" \
              --platform managed --region "$(jq -r '.region' "$CONTRACT_FILE")" --project "$(jq -r '.project_id' "$CONTRACT_FILE")" \
              --format="yaml(status.traffic)"
            exit 1
          fi
          echo "REVISION_URL=$REVISION_URL" >> "$GITHUB_ENV"

      - name: Prepare strict candidate smoke proof
        run: |
          umask 077
          SMOKE_DIRECTORY="$(mktemp -d "${RUNNER_TEMP}/logdate-cloud-smoke.XXXXXX")"
          chmod 700 "$SMOKE_DIRECTORY"
          INVOKER_TOKEN_FILE="$SMOKE_DIRECTORY/invoker-token"
          SMOKE_STATE_FILE="$SMOKE_DIRECTORY/state.json"
          : >"$INVOKER_TOKEN_FILE"
          : >"$SMOKE_STATE_FILE"
          chmod 600 "$INVOKER_TOKEN_FILE" "$SMOKE_STATE_FILE"
          gcloud auth print-identity-token --audiences "$REVISION_URL" >"$INVOKER_TOKEN_FILE"
          test -s "$INVOKER_TOKEN_FILE"
          HEALTH_INTERNAL_TOKEN="$(
            gcloud secrets versions access \
              "$(jq -r '.secret_env.HEALTH_INTERNAL_TOKEN.version' "$CONTRACT_FILE")" \
              --secret="$(jq -r '.secret_env.HEALTH_INTERNAL_TOKEN.secret_id' "$CONTRACT_FILE")" \
              --project="$(jq -r '.project_id' "$CONTRACT_FILE")"
          )"
          test -n "$HEALTH_INTERNAL_TOKEN"

          {
            echo "SMOKE_DIRECTORY=$SMOKE_DIRECTORY"
            echo "INVOKER_TOKEN_FILE=$INVOKER_TOKEN_FILE"
            echo "SMOKE_STATE_FILE=$SMOKE_STATE_FILE"
          } >> "$GITHUB_ENV"

          ./scripts/smoke-test-revision.sh \
            --service-url "$REVISION_URL" \
            --contract-file "$CONTRACT_FILE" \
            --expected-release "$(jq -r '.env_vars.RELEASE_VERSION' "$CONTRACT_FILE")" \
            --invoker-token-file "$INVOKER_TOKEN_FILE" \
            --phase prepare \
            --state-file "$SMOKE_STATE_FILE"

      - name: Promote candidate to 100 percent traffic
        run: |
          gcloud run services update-traffic "$(jq -r '.service_name' "$CONTRACT_FILE")" \
            --platform managed \
            --region "$(jq -r '.region' "$CONTRACT_FILE")" \
            --project "$(jq -r '.project_id' "$CONTRACT_FILE")" \
            --to-tags "$CANDIDATE_TAG=100"

      - name: Verify public durability and clean smoke data
        run: |
          HEALTH_INTERNAL_TOKEN="$(
            gcloud secrets versions access \
              "$(jq -r '.secret_env.HEALTH_INTERNAL_TOKEN.version' "$CONTRACT_FILE")" \
              --secret="$(jq -r '.secret_env.HEALTH_INTERNAL_TOKEN.secret_id' "$CONTRACT_FILE")" \
              --project="$(jq -r '.project_id' "$CONTRACT_FILE")"
          )"
          test -n "$HEALTH_INTERNAL_TOKEN"
          ./scripts/smoke-test-revision.sh \
            --service-url "$(jq -r '.canonical_origin' "$CONTRACT_FILE")" \
            --contract-file "$CONTRACT_FILE" \
            --expected-release "$(jq -r '.env_vars.RELEASE_VERSION' "$CONTRACT_FILE")" \
            --invoker-token-file "$INVOKER_TOKEN_FILE" \
            --phase verify-and-cleanup \
            --state-file "$SMOKE_STATE_FILE"

      - name: Verify deployed service
        run: |
          wait_for_health() {
            local url="$1"
            local attempts="$2"
            local sleep_seconds="$3"

            for _ in $(seq 1 "$attempts"); do
              if curl -sf --max-time 10 "$url/health" >/dev/null; then
                return 0
              fi
              sleep "$sleep_seconds"
            done

            return 1
          }

          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')

          echo "Cloud Run URL: $SERVICE_URL"
          if [[ -n "${DOMAIN}" ]]; then
            echo "Custom Domain: https://${{ env.DOMAIN }}"
          fi

          echo "Checking health on Cloud Run URL..."
          wait_for_health "$SERVICE_URL" 30 2 || exit 1

          if [[ -n "${DOMAIN}" ]]; then
            echo "Checking custom domain (may take 15-30 min for SSL)..."
            if wait_for_health "https://${{ env.DOMAIN }}" 10 3; then
              echo "Custom domain is working."
            else
              echo "Custom domain not yet responding; SSL may still be provisioning."
            fi
          fi
