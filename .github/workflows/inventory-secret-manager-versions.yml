name: Inventory Secret Manager Versions
run-name: Inventory ${{ inputs.environment }} Secret Manager metadata

on:
  workflow_dispatch:
    inputs:
      environment:
        description: LogDate Cloud environment to inventory.
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    name: Inventory ${{ inputs.environment }} Secret Manager metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Inventory Secret Manager metadata only
        run: |
          set +e
          inventory_output="$(./scripts/inventory-secret-manager-versions.sh --environment "${{ inputs.environment }}" 2>&1)"
          inventory_status=$?
          set -e
          if [[ "$inventory_status" -ne 0 ]]; then
            echo "::error::Secret Manager metadata inventory failed."
            {
              echo "### Secret Manager inventory failed"
              echo
              echo "The metadata-only check failed before it could produce an inventory."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$inventory_status"
          fi
          printf '%s\n' "$inventory_output"
