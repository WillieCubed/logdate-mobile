name: Publish Android to Play
run-name: Android Play ${{ inputs.stage || 'internal' }} ${{ inputs.candidate_tag || github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Play release action
        required: true
        type: choice
        options:
          - internal
          - start-5
          - advance-25
          - complete-100
          - halt
          - resume-5
          - resume-25
      candidate_tag:
        description: Tested android-v tag, required for production actions
        required: false
        type: string
      candidate_version_code:
        description: Exact tested internal Play version code, required for production actions
        required: false
        type: string
      gate_evidence:
        description: Link to the completed acceptance record and stage signal review
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-play-publish
  cancel-in-progress: false

jobs:
  publish-internal:
    name: Publish Android internal release
    if: ${{ vars.LOGDATE_PLAY_INTERNAL_PUBLISH_ENABLED == 'true' && (github.event_name == 'push' || inputs.stage == 'internal') }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    env:
      PLAY_TRACK: internal
      LOGDATE_RELEASE_STORE_BASE64: ${{ secrets.LOGDATE_RELEASE_STORE_BASE64 }}
      LOGDATE_RELEASE_STORE_PASSWORD: ${{ secrets.LOGDATE_RELEASE_STORE_PASSWORD }}
      LOGDATE_RELEASE_KEY_ALIAS: ${{ secrets.LOGDATE_RELEASE_KEY_ALIAS }}
      LOGDATE_RELEASE_KEY_PASSWORD: ${{ secrets.LOGDATE_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate as the Play publishing service account
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LOGDATE_PLAY_SERVICE_ACCOUNT }}

      - name: Materialize release Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_RELEASE_BASE64 }}
          android-flavor: release
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_RELEASE }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_RELEASE }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Resolve Android version
        id: version
        shell: bash
        run: ./scripts/resolve-android-play-version.sh

      - name: Prepare Play publish inputs
        id: prepare
        shell: bash
        run: ./scripts/prepare-android-play-publishing.sh internal

      - name: Publish release bundle to Play internal track
        run: >
          ./gradlew :app:android-main:publishReleaseBundle
          -Plogdate.backendUrl=https://cloud.logdate.app
          --release-name "${{ steps.version.outputs.internal_release_name }}"
        env:
          LOGDATE_PLAY_TRACK: ${{ env.PLAY_TRACK }}
          LOGDATE_VERSION_NAME: ${{ steps.version.outputs.version_name }}

      - name: Upload release bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-bundle-${{ env.PLAY_TRACK }}-${{ github.sha }}
          path: app/android-main/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up release files
        if: always()
        shell: bash
        run: |
          if [[ -n "${{ steps.prepare.outputs.keystore_path }}" ]]; then
            rm -f "${{ steps.prepare.outputs.keystore_path }}"
          fi
          rm -f app/android-main/src/release/google-services.json

  publish-production:
    name: Promote Android release to production
    if: ${{ vars.LOGDATE_PLAY_PRODUCTION_PUBLISH_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.stage != 'internal' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_tag }}
          fetch-depth: 0

      - name: Validate candidate and acceptance record
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_VERSION_CODE: ${{ inputs.candidate_version_code }}
          GATE_EVIDENCE: ${{ inputs.gate_evidence }}
        run: |
          [[ "$CANDIDATE_TAG" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A tested android-v tag is required.' >&2; exit 1; }
          [[ "$CANDIDATE_VERSION_CODE" =~ ^[0-9]+$ ]] || { echo 'The tested internal Play version code is required.' >&2; exit 1; }
          [[ -n "$GATE_EVIDENCE" ]] || { echo 'An acceptance and signal review link is required.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$(git rev-list -n 1 "$CANDIDATE_TAG")" ]] || { echo 'Checkout does not match candidate tag.' >&2; exit 1; }

      - name: Authenticate as the Play publishing service account
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.LOGDATE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Resolve Android version
        id: version
        shell: bash
        run: ./scripts/resolve-android-play-version.sh

      - name: Validate Play credentials
        shell: bash
        run: ./scripts/prepare-android-play-publishing.sh production

      - name: Find the internal release built from this tag
        id: internal
        shell: bash
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: ./scripts/resolve-play-internal-release.sh studio.hypertext.logdate "${{ steps.version.outputs.short_sha }}" "${{ inputs.candidate_version_code }}"

      - name: Check staged rollout transition
        id: transition
        shell: bash
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ROLLOUT_STAGE: ${{ inputs.stage }}
          VERSION_CODE: ${{ steps.internal.outputs.version_code }}
        run: ./scripts/check-play-rollout-transition.sh studio.hypertext.logdate "$VERSION_CODE" "$ROLLOUT_STAGE"

      - name: Start 5% rollout from tested internal artifact
        if: ${{ inputs.stage == 'start-5' }}
        run: >
          ./gradlew :app:android-main:promoteReleaseArtifact
          --from-track internal
          --promote-track production
          --version-code "${{ steps.internal.outputs.version_code }}"
          --release-name "${{ steps.version.outputs.production_release_name }}"
          --release-status inProgress
          --user-fraction 0.05

      - name: Advance the same production artifact to 25%
        if: ${{ inputs.stage == 'advance-25' }}
        run: >
          ./gradlew :app:android-main:promoteReleaseArtifact
          --update production
          --version-code "${{ steps.internal.outputs.version_code }}"
          --release-status inProgress
          --user-fraction 0.25

      - name: Complete the same production artifact at 100%
        if: ${{ inputs.stage == 'complete-100' }}
        run: >
          ./gradlew :app:android-main:promoteReleaseArtifact
          --update production
          --version-code "${{ steps.internal.outputs.version_code }}"
          --release-status completed

      - name: Halt the same production artifact
        if: ${{ inputs.stage == 'halt' }}
        run: >
          ./gradlew :app:android-main:promoteReleaseArtifact
          --update production
          --version-code "${{ steps.internal.outputs.version_code }}"
          --release-status halted
          --user-fraction "${{ steps.transition.outputs.current_fraction }}"

      - name: Resume the halted artifact at 5%
        if: ${{ inputs.stage == 'resume-5' }}
        run: >
          ./gradlew :app:android-main:promoteReleaseArtifact
          --update production
          --version-code "${{ steps.internal.outputs.version_code }}"
          --release-status inProgress
          --user-fraction 0.05

      - name: Resume the halted artifact at 25%
        if: ${{ inputs.stage == 'resume-25' }}
        run: >
          ./gradlew :app:android-main:promoteReleaseArtifact
          --update production
          --version-code "${{ steps.internal.outputs.version_code }}"
          --release-status inProgress
          --user-fraction 0.25

      - name: Draft GitHub Release for android-v* tag
        if: ${{ success() && inputs.stage == 'start-5' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.candidate_tag }}" \
            --draft \
            --generate-notes \
            --title "Android ${{ steps.version.outputs.version_name }} (${{ steps.internal.outputs.version_code }})"
