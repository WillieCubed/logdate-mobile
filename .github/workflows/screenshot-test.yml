name: Screenshot Tests
run-name: Screenshot tests for ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [main]
    paths:
      - 'app/android-main/**'
      - 'client/feature/**'
      - 'client/ui/**'
      - 'client/theme/**'
      - 'app/compose-main/**'
      - 'config/workspace/**'
      - 'build-logic/**'
      - '.github/workflows/screenshot-test.yml'
      - 'gradle/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/android-main/**'
      - 'app/wear/**'
      - 'app/compose-main/**'
      - 'client/feature/**'
      - 'client/ui/**'
      - 'client/theme/**'
      - '.github/workflows/screenshot-test.yml'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  android-wear-screenshots:
    name: ${{ matrix.platform }} screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            module: android-main
          - platform: Wear
            module: wear
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Materialize Android Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate ${{ matrix.platform }} screenshots
        run: ./gradlew :app:${{ matrix.module }}:validateDebugScreenshotTest --continue

      - name: Upload ${{ matrix.platform }} screenshot reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.module }}-screenshot-report
          path: app/${{ matrix.module }}/build/outputs/screenshotTest-results/
          retention-days: 14

  desktop-screenshots:
    name: Desktop screenshots
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate Desktop screenshots
        run: ./gradlew validateDesktopScreenshots --continue

      - name: Upload Desktop screenshot reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshot-report
          path: app/compose-main/build/reports/desktopScreenshotTest/
          retention-days: 14

  ios-screenshot-validation:
    name: iOS screenshot lane
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Materialize mobile Firebase configs
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}
          ios-google-service-info-plist-base64: ${{ secrets.LOGDATE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate iOS screenshot lane
        run: ./gradlew validateIosScreenshots --continue

      - name: Upload iOS screenshot reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshot-report
          path: app/compose-main/build/reports/tests/
          retention-days: 14
