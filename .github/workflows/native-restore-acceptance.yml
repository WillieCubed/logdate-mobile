name: Native Android restore acceptance
run-name: Native Android restore acceptance for ${{ github.sha }}

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/native-restore-acceptance.yml'
      - 'app/android-main/src/androidTest/**/NativeBackupTransferProbeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeJournalFixture.kt'
      - 'app/android-main/src/androidTest/**/NativeTransferRuntimeChecks.kt'
      - 'app/android-main/src/androidTest/**/NativeSourceSession*.kt'
      - 'app/android-main/src/androidTest/**/NativeDeviceEnrollment*.kt'
      - 'app/android-main/src/androidTest/**/NativeAutomaticMediaWorkerProbeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeDeferredOriginalUploadProbeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeOriginalMediaProbe.kt'
      - 'app/android-main/src/androidTest/**/NativeMediaReauthenticationProbeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeCurrentDraftRecoveryProbeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeNetworkPolicyHandoff.kt'
      - 'app/android-main/src/androidTest/**/NativeEmulatorUiObstructions.kt'
      - 'app/android-main/src/androidTest/**/NativeEmulatorUiObstructionsTest.kt'
      - 'app/android-main/src/androidTest/**/NativePartialMediaIdentityTest.kt'
      - 'app/android-main/src/androidTest/**/NativeRestoredWidgetProbeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeReleasedUpgradeProbeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeRetainedDraftShortcutProbeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeRetainedOfflineEditProbeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeRestorePrivacyRuntimeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeBackgroundCredentialCallbackTest.kt'
      - 'app/android-main/src/androidTest/**/NativeMissingMediaE2ETest.kt'
      - 'app/android-main/src/androidTest/**/ArchiveMediaRecoveryE2ETest.kt'
      - 'app/android-main/src/androidTest/**/ArchiveLowStorageRecoveryTest.kt'
      - 'app/android-main/src/androidTest/**/RestoreStateAccessibilityRuntimeTest.kt'
      - 'app/android-main/src/androidTest/**/RestoreTalkBackRuntimeTest.kt'
      - 'app/android-main/src/androidTest/**/StartupRecoveryTalkBackScenario.kt'
      - 'app/android-main/src/androidTest/**/CloudArchiveWorkerFixture.kt'
      - 'app/android-main/src/androidTest/**/RestoredJournalLockRuntimeTest.kt'
      - 'app/android-main/src/androidTest/**/RestoredAppLockEnrollmentRuntimeTest.kt'
      - 'app/android-main/src/androidTest/**/InterruptedDatabaseKeyRecoveryTest.kt'
      - 'app/android-main/src/androidTest/**/NativeRetainedKeyFailureTest.kt'
      - 'app/android-main/src/androidTest/**/LegacyPlaintextMigrationTest.kt'
      - 'app/android-main/src/androidTest/**/NewerJournalRecoveryRuntimeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeRecoveryWorkStateTest.kt'
      - 'app/android-main/src/androidTest/**/CloudRestoreWorkPersistenceProbeTest.kt'
      - 'app/android-main/src/androidTest/**/AndroidSync*Runtime*.kt'
      - 'app/android-main/src/androidTest/**/RestoreWorkerSessionRecoveryTest.kt'
      - 'app/android-main/src/androidTest/**/RestoreWorkerTestBindings.kt'
      - 'app/android-main/src/androidTest/**/NativeRestoredEntryEditingTest.kt'
      - 'app/android-main/src/androidTest/**/TransferredInstallationTrustTest.kt'
      - 'app/android-main/src/androidTest/**/NativeTransferredPublicationProbeTest.kt'
      - 'app/android-main/src/androidTest/**/RestoredReminderSchedulingRuntimeTest.kt'
      - 'app/android-main/src/androidTest/**/RestoredAlarmDeliveryRuntimeTest.kt'
      - 'app/android-main/src/androidTest/**/RestoredReminderColdStartTest.kt'
      - 'app/android-main/src/androidTest/**/RecoveryFixtureCleanup*.kt'
      - 'app/android-main/src/androidTest/**/RestoredNotificationDeliveryTest.kt'
      - 'app/android-main/src/androidTest/**/RestoredShortcutTargetsRuntimeTest.kt'
      - 'app/android-main/src/androidTest/**/NativeRestoredSettingsE2ETest.kt'
      - 'app/android-main/src/androidTest/**/CompletedRecordingRestartTest.kt'
      - 'app/android-main/src/androidTest/**/CompletedRecordingColdStartTest.kt'
      - 'app/android-main/src/androidTest/assets/recovery/**'
      - 'app/android-main/src/main/**'
      - 'app/compose-main/src/androidMain/**'
      - 'app/compose-main/src/commonMain/**'
      - 'client/**'
      - 'build-logic/src/**/GenerateAndroidShortcuts*'
      - 'build-logic/src/main/kotlin/app/logdate/LogDateReleasePlugin.kt'
      - 'scripts/tests/native-backup/**'
      - 'scripts/ci/start-test-services.py'
      - 'scripts/ci/screenshot-build-cache.gradle.kts'
      - 'scripts/tests/ci/test-acceptance-parallelism.py'
      - 'server/**'
      - 'shared/model/**'
      - 'tests/e2e/managed-talkback-acceptance.py'
      - 'tests/e2e/test_managed_talkback_acceptance.py'
      - 'tests/e2e/managed-permission-acceptance.py'
      - 'tests/e2e/test_managed_permission_acceptance.py'
      - 'tests/e2e/managed-native-*.py'
      - 'tests/e2e/managed-modern-callback-acceptance.sh'
      - 'tests/e2e/test_managed_native*.py'
      - 'tools/native-restore-driver/**'
      - 'tests/e2e/native-talkback-touch.c'
      - 'tests/e2e/native-backup-acceptance.py'
      - 'tests/e2e/native-publication-acceptance.py'
      - 'tests/e2e/native-instrumentation-results.py'
      - 'tests/e2e/native-key-recovery-cases.json'
      - 'tests/e2e/native-recording-recovery-cases.json'
      - 'tests/e2e/native-alarm-delivery-cases.json'
      - 'tests/e2e/native-modern-callback-cases.json'
      - 'tests/e2e/native-modern-callback-driver-cases.json'
      - 'tests/e2e/test_native*.py'
      - 'tests/e2e/native-d2d-acceptance.py'
      - 'tests/e2e/native-missing-media-acceptance.py'
      - 'tests/e2e/native-storage-recovery-acceptance.py'
      - 'tests/e2e/native-recovery-ui-acceptance.py'
      - 'tests/e2e/native-permission-acceptance.py'
      - 'tests/e2e/native-post-transfer-acceptance.py'
      - 'tests/e2e/native-restore-work-restart-acceptance.py'
      - 'tests/e2e/native-device-enrollment-acceptance.py'
      - 'tests/e2e/native-automatic-media-worker-acceptance.py'
      - 'tests/e2e/native-media-reauthentication-acceptance.py'
      - 'tests/e2e/native-widget-transfer-acceptance.py'
      - 'tests/e2e/native-released-upgrade-acceptance.py'
      - 'integration/server-client-e2e/src/test/kotlin/app/logdate/integration/e2e/harness/**'
      - 'integration/server-client-e2e/build.gradle.kts'
      - 'build.gradle.kts'
  workflow_dispatch:

# Superseded PR runs use disposable hosted emulators and can release their runners.
concurrency:
  group: native-restore-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-apks:
    name: Compile shared managed acceptance inputs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LOGDATE_CI_BUILD_CACHE_DIR: ${{ github.workspace }}/ci-native-build-cache
    outputs:
      artifact_id: ${{ steps.shared-build.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate native acceptance harnesses
        run: |
          python3 -m unittest discover -s tests/e2e -p 'test_native*.py'
          python3 -m unittest discover -s tests/e2e -p 'test_managed*.py'
          python3 scripts/tests/native-backup/test-native-acceptance-safety.py
          python3 scripts/tests/native-backup/test-native-instrumentation-results.py
          python3 scripts/tests/native-backup/test-native-device-enrollment-acceptance.py

      - name: Materialize Android Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}

      - name: Set up JDK 21 for the enrollment server and native harness
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Prepare Android compile SDK
        shell: bash
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0'

      - name: Compile the app and managed driver once
        run: |
          ./gradlew :app:android-main:assembleDebug :app:android-main:assembleDebugAndroidTest \
            :tools:native-restore-driver:assembleDebug :tools:native-restore-driver:assembleDebugAndroidTest \
            --init-script scripts/ci/screenshot-build-cache.gradle.kts --build-cache \
            --max-workers=2 --no-daemon --console=plain
          git rev-parse HEAD > "$LOGDATE_CI_BUILD_CACHE_DIR/native-acceptance-source.txt"

      - name: Share exact-source native compilation cache
        id: shared-build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-build-cache-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.LOGDATE_CI_BUILD_CACHE_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  managed-startup:
    name: Verify restored startup and journal compatibility on managed devices
    runs-on: ubuntu-latest
    needs: native-apks
    timeout-minutes: 40
    env:
      LOGDATE_CI_BUILD_CACHE_DIR: ${{ github.workspace }}/ci-native-build-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Materialize Android Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify same-run native compilation artifact binding
        env:
          ARTIFACT_ID: ${{ needs.native-apks.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Restore exact-source native compilation cache
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.native-apks.outputs.artifact_id }}
          path: ${{ env.LOGDATE_CI_BUILD_CACHE_DIR }}

      - name: Bind all managed builds to the compilation cache
        shell: bash
        run: |
          test "$(cat "$LOGDATE_CI_BUILD_CACHE_DIR/native-acceptance-source.txt")" = "$GITHUB_SHA"
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cp scripts/ci/screenshot-build-cache.gradle.kts "$init_dir/logdate-shared-native.gradle.kts"

      - name: Prepare the managed API 34 image
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platform-tools' 'platforms;android-34' 'system-images;android-34;google_apis;x86_64'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble acceptance APKs before starting managed emulators
        run: |
          free -h
          df -h "$GITHUB_WORKSPACE"
          ./gradlew :app:android-main:assembleDebug :app:android-main:assembleDebugAndroidTest \
            :tools:native-restore-driver:assembleDebug :tools:native-restore-driver:assembleDebugAndroidTest \
            --max-workers=2 --no-daemon --console=plain
          free -h

      - name: Record exact managed acceptance candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/native-inputs"
          git rev-parse HEAD > "$RUNNER_TEMP/native-inputs/native-acceptance-source.txt"
          sha256sum app/android-main/build/outputs/apk/debug/android-main-debug.apk \
            app/android-main/build/outputs/apk/androidTest/debug/android-main-debug-androidTest.apk \
            tools/native-restore-driver/build/outputs/apk/debug/native-restore-driver-debug.apk \
            tools/native-restore-driver/build/outputs/apk/androidTest/debug/native-restore-driver-debug-androidTest.apk \
            > "$RUNNER_TEMP/native-inputs/native-acceptance-apks.sha256"
          sha256sum --check "$RUNNER_TEMP/native-inputs/native-acceptance-apks.sha256"

      - name: Verify restored reminder schedules on a managed device
        run: |
          ./gradlew :app:android-main:phoneApi34DebugAndroidTest \
            -Plogdate.androidTestClass=app.logdate.client.e2e.RestoredReminderSchedulingRuntimeTest \
            -Pandroid.testInstrumentationRunnerArguments.restoreAlarmAcceptance=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader \
            --max-workers=2 --no-daemon --console=plain
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          directory = Path("app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34")
          cases = [case for report in directory.glob("TEST-*.xml")
                   for case in ET.parse(report).getroot().iter("testcase")
                   if case.get("classname") == "app.logdate.client.e2e.RestoredReminderSchedulingRuntimeTest"]
          assert len(cases) == 1, "The native reminder case must execute exactly once"
          assert cases[0].get("name") == "currentPreferencesRecreateOnlyValidSchedules"
          assert not any(cases[0].find(tag) is not None for tag in ["skipped", "failure", "error"])
          import os, shutil
          destination = Path(os.environ["RUNNER_TEMP"]) / "native-gmd" / "reminder-schedules"
          shutil.copytree(directory, destination / "results")
          output = Path("app/android-main/build/intermediates/managed_device_android_test_additional_output/debugAndroidTest/phoneApi34DebugAndroidTest")
          if output.exists():
              shutil.copytree(output, destination / "output")
          PYVERIFY

      - name: Verify reminder reconstruction across cold processes
        run: |
          ./gradlew :app:android-main:phoneApi34DebugAndroidTest \
            -Plogdate.androidTestClass=app.logdate.client.e2e.RestoredReminderColdStartTest,app.logdate.client.e2e.RecoveryFixtureCleanupRuntimeTest \
            -Plogdate.androidTestOrchestrator=true \
            -Pandroid.testInstrumentationRunnerArguments.restoreAlarmColdStartAcceptance=true \
            -Pandroid.testInstrumentationRunnerArguments.clearPackageData=false \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader \
            --max-workers=2 --no-daemon --console=plain
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          directory = Path("app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34")
          cases = [case for report in directory.glob("TEST-*.xml")
                   for case in ET.parse(report).getroot().iter("testcase")
                   if case.get("classname") == "app.logdate.client.e2e.RestoredReminderColdStartTest"]
          expected = {
              "stage00PreserveOriginalPreferencesAndJournal",
              "stage01LegacyAlarmsReturnThroughColdForegroundStartup",
              "stage02MomentEvaluationReturnsThroughColdForegroundStartup",
              "stage03DisabledLegacyPreferencesCancelStaleDeviceWork",
              "stage04DisabledMomentConsentCancelsStaleDeviceWork",
              "stage05RestoreOriginalPreferencesAndVerifyEveryProcess",
          }
          assert len(cases) == len(expected) and {case.get("name") for case in cases} == expected
          assert not any(case.find(tag) is not None for case in cases for tag in ["skipped", "failure", "error"])
          cleanup = [case for report in directory.glob("TEST-*.xml")
                     for case in ET.parse(report).getroot().iter("testcase")
                     if case.get("classname") == "app.logdate.client.e2e.RecoveryFixtureCleanupRuntimeTest"]
          assert len(cleanup) == 3
          assert not any(case.find(tag) is not None for case in cleanup for tag in ["skipped", "failure", "error"])
          import os, shutil
          destination = Path(os.environ["RUNNER_TEMP"]) / "native-gmd" / "cold-reminders"
          shutil.copytree(directory, destination / "results")
          output = Path("app/android-main/build/intermediates/managed_device_android_test_additional_output/debugAndroidTest/phoneApi34DebugAndroidTest")
          if output.exists():
              shutil.copytree(output, destination / "output")
          PYVERIFY

      - name: Recover completed recordings across cold foreground startup
        run: |
          ./gradlew :app:android-main:phoneApi34DebugAndroidTest \
            -Plogdate.androidTestClass=app.logdate.client.e2e.CompletedRecordingColdStartTest \
            -Plogdate.androidTestOrchestrator=true \
            -Pandroid.testInstrumentationRunnerArguments.clearPackageData=false \
            -Pandroid.testInstrumentationRunnerArguments.recordingColdStartAcceptance=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader \
            --max-workers=2 --no-daemon --console=plain
          python3 tests/e2e/native-instrumentation-results.py \
            --managed-results app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34 \
            --expected-cases tests/e2e/native-recording-recovery-cases.json
          mkdir -p "$RUNNER_TEMP/native-gmd/completed-recording"
          cp -R app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34 \
            "$RUNNER_TEMP/native-gmd/completed-recording/results"

      - name: Preserve journals that require a newer app
        run: |
          ./gradlew :app:android-main:phoneApi34DebugAndroidTest \
            -Plogdate.androidTestClass=app.logdate.client.e2e.NewerJournalRecoveryRuntimeTest,app.logdate.client.e2e.LegacyPlaintextMigrationTest \
            -Plogdate.androidTestOrchestrator=false \
            -Pandroid.testInstrumentationRunnerArguments.newerJournalAcceptance=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader \
            --max-workers=2 --no-daemon --console=plain
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          directory = Path("app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34")
          classes = {"app.logdate.client.e2e.NewerJournalRecoveryRuntimeTest", "app.logdate.client.e2e.LegacyPlaintextMigrationTest"}
          cases = [case for report in directory.glob("TEST-*.xml")
                   for case in ET.parse(report).getroot().iter("testcase")
                   if case.get("classname") in classes]
          expected = {
              "newerJournalStaysEncryptedAndOffersAnUpdateWithoutReplacingItsKey",
              "newerPlaintextJournalIsRefusedBeforeAnyMigrationFileIsChanged",
              "newerLegacyCipherJournalIsRefusedBeforeCipherMigration",
              "plaintextJournalUpgradesThroughTheProductionKeyProvider",
              "mismatchedCandidateDoesNotReplaceEncryptedJournalWithOlderPlaintextBackup",
          }
          assert len(cases) == len(expected) and {case.get("name") for case in cases} == expected
          assert not any(case.find(tag) is not None for case in cases for tag in ["skipped", "failure", "error"])
          import os, shutil
          destination = Path(os.environ["RUNNER_TEMP"]) / "native-gmd" / "newer-journal"
          shutil.copytree(directory, destination / "results")
          output = Path("app/android-main/build/intermediates/managed_device_android_test_additional_output/debugAndroidTest/phoneApi34DebugAndroidTest")
          if output.exists():
              shutil.copytree(output, destination / "output")
          PYVERIFY

      - name: Verify database keys and restart-safe recovery on a managed device
        run: |
          classes="$(python3 tests/e2e/native-instrumentation-results.py --expected-cases tests/e2e/native-key-recovery-cases.json --print-classes)"
          ./gradlew :app:android-main:phoneApi34DebugAndroidTest \
            "-Plogdate.androidTestClass=$classes" \
            -Plogdate.androidTestOrchestrator=false \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader \
            --max-workers=2 --no-daemon --console=plain
          python3 tests/e2e/native-instrumentation-results.py \
            --managed-results app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34 \
            --expected-cases tests/e2e/native-key-recovery-cases.json
          mkdir -p "$RUNNER_TEMP/native-gmd/key-recovery"
          cp -R app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34 \
            "$RUNNER_TEMP/native-gmd/key-recovery/results"

      - name: Verify reconstructed notification and shortcut delivery
        run: |
          ./gradlew :app:android-main:phoneApi34DebugAndroidTest \
            '-Plogdate.androidTestClass=app.logdate.client.e2e.RestoredNotificationDeliveryTest#concurrent_recreated_workers_post_once_with_durable_history,app.logdate.client.e2e.RestoredShortcutTargetsRuntimeTest,app.logdate.client.e2e.ArchiveLowStorageRecoveryTest#managedAcceptedArchiveWaitsForStorageThenResumes' \
            -Plogdate.androidTestOrchestrator=false \
            -Pandroid.testInstrumentationRunnerArguments.restorePermissionAcceptance=true \
            -Pandroid.testInstrumentationRunnerArguments.notificationDedupeAcceptance=true \
            -Pandroid.testInstrumentationRunnerArguments.nativeShortcutAcceptance=true \
            -Pandroid.testInstrumentationRunnerArguments.managedStorageRecoveryAcceptance=true \
            -Pandroid.testInstrumentationRunnerArguments.storageRecoveryLabel=managed-storage-acceptance \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader \
            --max-workers=2 --no-daemon --console=plain
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          directory = Path("app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34")
          cases = [case for report in directory.glob("TEST-*.xml")
                   for case in ET.parse(report).getroot().iter("testcase")]
          expected = {
              ("app.logdate.client.e2e.RestoredNotificationDeliveryTest", "concurrent_recreated_workers_post_once_with_durable_history"),
              ("app.logdate.client.e2e.RestoredShortcutTargetsRuntimeTest", "recreatedDraftShortcutTargetsTheRetainedDraftWithoutDuplicates"),
              ("app.logdate.client.e2e.RestoredShortcutTargetsRuntimeTest", "manifestCaptureShortcutsTargetInstalledApp"),
              ("app.logdate.client.e2e.ArchiveLowStorageRecoveryTest", "managedAcceptedArchiveWaitsForStorageThenResumes"),
          }
          assert len(cases) == len(expected) and {(case.get("classname"), case.get("name")) for case in cases} == expected
          assert not any(case.find(tag) is not None for case in cases for tag in ["skipped", "failure", "error"])
          import os, shutil
          destination = Path(os.environ["RUNNER_TEMP"]) / "native-gmd" / "device-surfaces"
          shutil.copytree(directory, destination / "results")
          PYVERIFY

      - name: Deliver a restored alarm through the production receiver
        run: |
          ./gradlew :app:android-main:phoneApi34DebugAndroidTest \
            -Plogdate.androidTestClass=app.logdate.client.e2e.RestoredAlarmDeliveryRuntimeTest \
            -Plogdate.androidTestOrchestrator=false \
            -Pandroid.testInstrumentationRunnerArguments.restoreAlarmFireAcceptance=true \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader \
            --max-workers=2 --no-daemon --console=plain
          python3 tests/e2e/native-instrumentation-results.py \
            --managed-results app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34 \
            --expected-cases tests/e2e/native-alarm-delivery-cases.json
          mkdir -p "$RUNNER_TEMP/native-gmd/alarm-delivery"
          cp -R app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34 \
            "$RUNNER_TEMP/native-gmd/alarm-delivery/results"

      - name: Upload managed startup acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-managed-startup-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-inputs/**
            ${{ runner.temp }}/native-gmd/**
            app/android-main/build/outputs/androidTest-results/managedDevice/debug/phoneApi34/**
            app/android-main/build/intermediates/managed_device_android_test_additional_output/debugAndroidTest/phoneApi34DebugAndroidTest/**
          if-no-files-found: warn
          retention-days: 14

  native-transfer-scenarios:
    name: Managed native restore (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: native-apks
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [
            partial,
            archive,
            publication,
            contracts,
            missing-keys,
            credentials-only,
            data-only,
            privacy,
            work-restart,
            d2d,
            enrollment,
            widget,
          ]
    env:
      LOGDATE_CI_BUILD_CACHE_DIR: ${{ github.workspace }}/ci-native-build-cache
      ANDROID_AVD_HOME: ${{ github.workspace }}/.native-managed-avds
      LOGDATE_NATIVE_ACCEPTANCE_PACKAGE: studio.hypertext.logdate.debug
      NATIVE_SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate native acceptance harnesses
        run: |
          python3 -m unittest discover -s tests/e2e -p 'test_native*.py'
          python3 -m unittest discover -s tests/e2e -p 'test_managed*.py'
          python3 scripts/tests/native-backup/test-native-acceptance-safety.py
          python3 scripts/tests/native-backup/test-native-instrumentation-results.py
          python3 scripts/tests/native-backup/test-native-device-enrollment-acceptance.py

      - name: Materialize Android Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}

      - name: Set up JDK 21 for the enrollment server and native harness
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify same-run native compilation artifact binding
        env:
          ARTIFACT_ID: ${{ needs.native-apks.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Restore exact-source native compilation cache
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.native-apks.outputs.artifact_id }}
          path: ${{ env.LOGDATE_CI_BUILD_CACHE_DIR }}

      - name: Bind all managed builds to the compilation cache
        shell: bash
        run: |
          test "$(cat "$LOGDATE_CI_BUILD_CACHE_DIR/native-acceptance-source.txt")" = "$GITHUB_SHA"
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cp scripts/ci/screenshot-build-cache.gradle.kts "$init_dir/logdate-shared-native.gradle.kts"

      - name: Prepare managed Android images
        shell: bash
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          image='system-images;android-34;google_apis;x86_64'
          if [[ "$NATIVE_SCENARIO" == d2d ]]; then
            image='system-images;android-34;google_apis_playstore;x86_64'
          fi
          sdkmanager 'platform-tools' 'platforms;android-34' 'platforms;android-37.0' 'emulator' "$image"
          command -v lsof
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble acceptance APKs before starting managed emulators
        shell: bash
        run: |
          tasks=(:app:android-main:assembleDebug :app:android-main:assembleDebugAndroidTest
                 :tools:native-restore-driver:assembleDebug :tools:native-restore-driver:assembleDebugAndroidTest)
          if [[ "$NATIVE_SCENARIO" == enrollment ]]; then
            tasks+=(:integration:server-client-e2e:writeAndroidHistoryHarnessClasspath)
          fi
          ./gradlew "${tasks[@]}" --max-workers=2 --no-daemon --console=plain

      - name: Record exact managed acceptance candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/native-inputs"
          git rev-parse HEAD > "$RUNNER_TEMP/native-inputs/native-acceptance-source.txt"
          sha256sum app/android-main/build/outputs/apk/debug/android-main-debug.apk \
            app/android-main/build/outputs/apk/androidTest/debug/android-main-debug-androidTest.apk \
            tools/native-restore-driver/build/outputs/apk/debug/native-restore-driver-debug.apk \
            tools/native-restore-driver/build/outputs/apk/androidTest/debug/native-restore-driver-debug-androidTest.apk \
            > "$RUNNER_TEMP/native-inputs/native-acceptance-apks.sha256"
          sha256sum --check "$RUNNER_TEMP/native-inputs/native-acceptance-apks.sha256"

      - name: Start isolated enrollment database
        if: matrix.scenario == 'enrollment'
        run: |
          python3 scripts/ci/start-test-services.py start e2e
          python3 - <<'PY'
          import base64, json, os, pathlib, secrets
          os.umask(0o077)
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          (root / 'native-enrollment-environment.json').write_text(json.dumps({
              'DATABASE_URL': 'jdbc:postgresql://127.0.0.1:5432/logdate',
              'DATABASE_USER': 'logdate', 'DATABASE_PASSWORD': 'logdate',
              'SERVER_ENCRYPTION_KEY': base64.b64encode(secrets.token_bytes(32)).decode(),
              'LOGDATE_BLOB_STORAGE_DIR': str(root / 'native-enrollment-blobs'),
          }))
          PY

      - name: Run native oracles inside the managed lifecycle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-managed"
          arguments=(--output "$RUNNER_TEMP/native-managed/$NATIVE_SCENARIO")
          case "$NATIVE_SCENARIO" in
            partial)
              arguments+=(-- --exercise-quota --exercise-partial-media --exercise-duplicate-restore) ;;
            archive)
              arguments+=(-- --exercise-archive-recovery) ;;
            publication)
              arguments+=(--mode publication --after-transfer missing-media --after-transfer storage --after-transfer ui) ;;
            contracts)
              arguments+=(--after-transfer contracts) ;;
            missing-keys)
              arguments+=(-- --exercise-missing-keys) ;;
            credentials-only)
              arguments+=(-- --exercise-credentials-only) ;;
            data-only)
              arguments+=(-- --exercise-data-only) ;;
            privacy)
              arguments+=(-- --exercise-missing-privacy) ;;
            work-restart)
              arguments+=(--mode work-restart --after-transfer permissions) ;;
            d2d)
              arguments+=(--mode d2d) ;;
            enrollment)
              arguments+=(--mode enrollment
                --classpath integration/server-client-e2e/build/android-history-harness.classpath
                --fixture-environment "$RUNNER_TEMP/native-enrollment-environment.json") ;;
            widget)
              arguments+=(--mode widget) ;;
            *) exit 2 ;;
          esac
          python3 tests/e2e/managed-native-restore-acceptance.py "${arguments[@]}"

      - name: Stop enrollment database
        if: always() && matrix.scenario == 'enrollment'
        run: python3 scripts/ci/start-test-services.py stop e2e

      - name: Upload native restore acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-restore-${{ matrix.scenario }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-inputs/**
            ${{ runner.temp }}/native-managed/**
            !${{ runner.temp }}/native-managed/**/apks/**
            !${{ runner.temp }}/native-managed/**/server-control/**
            !${{ runner.temp }}/native-managed/**/managed-sdk/**
          if-no-files-found: warn
          retention-days: 14

  native-transfer:
    name: Exercise Android native restore and quota on emulators
    if: always()
    needs: native-transfer-scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Require every native restore scenario
        env:
          RESULT: ${{ needs.native-transfer-scenarios.result }}
        run: test "$RESULT" = success

  native-transfer-api-36-1:
    name: Verify Android 16 QPR2 restore callback on emulators
    runs-on: ubuntu-latest
    needs: native-apks
    timeout-minutes: 35
    env:
      LOGDATE_CI_BUILD_CACHE_DIR: ${{ github.workspace }}/ci-native-build-cache
      ANDROID_AVD_HOME: ${{ github.workspace }}/.native-modern-avds
      LOGDATE_NATIVE_ACCEPTANCE_PACKAGE: studio.hypertext.logdate.debug
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Materialize Android Firebase config
        uses: ./.github/actions/setup-firebase-configs
        with:
          android-google-services-json-base64: ${{ secrets.LOGDATE_ANDROID_GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
          android-maps-api-key: ${{ secrets.LOGDATE_GOOGLE_MAPS_API_KEY_DEBUG }}
          google-server-client-id: ${{ vars.LOGDATE_GOOGLE_SERVER_CLIENT_ID_DEBUG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Verify same-run native compilation artifact binding
        env:
          ARTIFACT_ID: ${{ needs.native-apks.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Restore exact-source native compilation cache
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.native-apks.outputs.artifact_id }}
          path: ${{ env.LOGDATE_CI_BUILD_CACHE_DIR }}

      - name: Bind all managed builds to the compilation cache
        shell: bash
        run: |
          test "$(cat "$LOGDATE_CI_BUILD_CACHE_DIR/native-acceptance-source.txt")" = "$GITHUB_SHA"
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cp scripts/ci/screenshot-build-cache.gradle.kts "$init_dir/logdate-shared-native.gradle.kts"

      - name: Prepare the managed Android 16 QPR2 image
        shell: bash
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platform-tools' 'platforms;android-36.1' 'platforms;android-37.0' 'emulator' \
            'system-images;android-36.1;google_apis_playstore;x86_64'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore compiled managed callback inputs
        run: >-
          ./gradlew :app:android-main:assembleDebug :app:android-main:assembleDebugAndroidTest
          :tools:native-restore-driver:assembleDebug :tools:native-restore-driver:assembleDebugAndroidTest
          --max-workers=2 --no-daemon --console=plain

      - name: Record exact managed acceptance candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/native-inputs"
          git rev-parse HEAD > "$RUNNER_TEMP/native-inputs/native-acceptance-source.txt"
          sha256sum app/android-main/build/outputs/apk/debug/android-main-debug.apk \
            app/android-main/build/outputs/apk/androidTest/debug/android-main-debug-androidTest.apk \
            tools/native-restore-driver/build/outputs/apk/debug/native-restore-driver-debug.apk \
            tools/native-restore-driver/build/outputs/apk/androidTest/debug/native-restore-driver-debug-androidTest.apk \
            > "$RUNNER_TEMP/native-inputs/native-acceptance-apks.sha256"
          sha256sum --check "$RUNNER_TEMP/native-inputs/native-acceptance-apks.sha256"

      - name: Verify the exact Android 16 QPR2 callback contract on a managed device
        run: bash tests/e2e/managed-modern-callback-acceptance.sh "$RUNNER_TEMP/native-restore-api36-1"

      - name: Upload API 36.1 restore acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-restore-api36-1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-inputs/**
            ${{ runner.temp }}/native-restore-api36-1/**
          if-no-files-found: warn
          retention-days: 14
